services:
  xdbc-server:
    image: xdbc-unified:latest
    container_name: xdbcserver
    restart: always
    volumes:
      - /dev/shm:/dev/shm
    ports:
      - 1234:1234
      - 1235:1235
      - 1236:1236
      - 1237:1237
      - 1238:1238
    shm_size: '16gb'
    cap_add:
      - NET_ADMIN
    networks:
      - xdbc-net
    labels:
      com.docker-tc.enabled: 1

  xdbc-client:
    image: xdbc-unified:latest
    container_name: xdbcclient
    restart: always
    volumes:
      - /dev/shm:/dev/shm
    shm_size: '16gb'
    cap_add:
      - NET_ADMIN
    networks:
      - xdbc-net
    labels:
      com.docker-tc.enabled: 1

  # postgres-1:
  #   image: postgresdb
  #   container_name: pg1
  #   restart: always
  #   volumes:
  #     - test-data:/data
  #     - pgvolume1:/var/lib/postgresql/
  #   ports:
  #     - 15432:5432
  #   shm_size: '2gb'
  #   networks:
  #     - xdbc-net

  tc:
    image: "lukaszlach/docker-tc"
    container_name: docker-tc
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/docker-tc:/var/docker-tc
    deploy:
      mode: global
      restart_policy:
        condition: any
    environment:
      HTTP_BIND: "127.0.0.1"
      HTTP_PORT: "4080"
    network_mode: host

volumes:
  test-data:
    external: true
  pgvolume1:
  chdbvol:


networks:
  xdbc-net:
    external: true
